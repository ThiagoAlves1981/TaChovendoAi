<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="js/main.js" defer type="module"></script>
    <link rel="stylesheet" href="css/main.css" />
    <title>Tá chovendo ai?</title>
  </head>

  <body>
    <nav class="navbar bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <img
            src="https://cdn-icons-png.flaticon.com/512/11947/11947110.png"
            alt="Logo"
            width="30"
            height="24"
            class="d-inline-block align-text-top"
          />
          Ta chovendo ai?
        </a>
      </div>
    </nav>

    <main>
      <div class="container">
        <div class="row" id="divPaiTextCard">
          <div class="text-cards">
            <h1>Seu melhor site de clima</h1>
            <p>Digite abaixo a sua localizacao:</p>
            <div class="divInput">
              <label for="City">Cidade</label>
              <input type="text" name="City" id="city" />
            </div>
            <div class="divInput">
              <label for="State">Estado/Provincia</label>
              <input type="text" name="State" id="state" />
              <button type="submit" id="submit">Enviar</button>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="small-text-cards">
            <h2>Clima da sua localização:</h2>
          </div>
        </div>
        <div class="row" id="infoRow">
          <div id="weatherShowContainer" class="col-xm-12 col-sm-6 col-md-4">
            <div id="weatherCard" class="weather-cards"></div>
          </div>

          <div id="weatherShowMarineContainer" class="col-xm-12 col-sm-6 col-md-4">
            <div id="weatherCardMarine" class="weather-cards"></div>
          </div>

          <div id="weatherShowFitContainer" class="col-xm-12 col-sm-12 col-md-4">
            <div id="weatherCardFitness" class="weather-cards"></div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
